<style>
:root{
  --navy:#0E2A43;--navy-d:#08192B;
  --ivory:#F5F2EA;--card:#FFFFFF;
  --green:#2E6B4F;--green-d:#1D4A36;--lime:#A9C94E;--sage:#8FB8A6;
  --ink:#1E2A26;--muted:#6E7B74;--line:rgba(30,42,38,.12);
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E7E4DC;color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding:0 0 max(28px,env(safe-area-inset-bottom))}
@media(min-width:560px){body{padding:28px 16px 48px}}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:10px}
#card{max-width:480px;margin:0 auto;background:var(--ivory);overflow:hidden}
@media(min-width:560px){#card{border-radius:28px;box-shadow:0 20px 56px rgba(14,42,67,.20)}}

/* ---------- шапка ---------- */
.top{position:relative;overflow:hidden;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 24px 28px;
  background:linear-gradient(165deg,#12395A 0%,#0E2A43 55%,#08192B 100%)}
.top .bot{position:absolute;inset:0;width:100%;height:100%}
.top .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,25,43,.04) 0%,rgba(8,25,43,.26) 42%,rgba(8,25,43,.64) 100%)}
.top > *:not(.bot):not(.veil){position:relative;z-index:2}
.tbar{display:flex;align-items:center;gap:12px;min-height:34px}
.tbar img{height:34px;width:auto}
.pills{margin-left:auto;display:flex;gap:5px}
.pill{min-width:40px;min-height:32px;display:grid;place-items:center;font-size:11.5px;font-weight:700;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.78);cursor:pointer;font-family:inherit;padding:0 8px}
.pill.on{background:#fff;color:var(--navy);border-color:#fff}

.who{display:flex;align-items:center;gap:16px;margin-top:28px}
.who > div{min-width:0}
.ava{width:88px;height:88px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,#2E6B4F,#12395A);
  box-shadow:0 0 0 1px rgba(169,201,78,.55), 0 0 0 7px rgba(143,184,166,.14), 0 10px 26px rgba(0,0,0,.34)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava span{font-family:var(--ui);font-weight:800;font-size:28px;color:rgba(255,255,255,.9)}
.who h1{font-weight:800;font-size:clamp(23px,6vw,28px);margin:0;line-height:1.12;letter-spacing:-.02em}
.who .alt{font-size:14.5px;color:rgba(255,255,255,.74);margin-top:3px;font-weight:600}
.who .role{color:var(--lime);font-size:13.5px;font-weight:700;margin-top:8px;line-height:1.35}
.who .org{color:rgba(255,255,255,.6);font-size:12.5px;margin-top:3px}

.save{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;margin-top:24px;
  border:none;border-radius:16px;background:var(--lime);color:#1B3311;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.save svg{width:19px;height:19px}
.share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:9px;
  border:1px solid rgba(255,255,255,.32);border-radius:16px;background:transparent;color:#fff;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer}

/* ---------- действия ---------- */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 16px 4px}
.act{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;min-height:86px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.act svg{width:22px;height:22px;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.act b{font-size:12.5px;font-weight:700;color:var(--green-d)}
.act small{font-size:10.5px;color:var(--muted);line-height:1.2;word-break:break-word}

/* ---------- секции ---------- */
.sec{padding:20px 16px 0}
.sec h2{font-size:12.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--green);margin:0 0 10px;padding-left:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;position:relative;overflow:hidden}
.box p{margin:0;font-size:15px;color:#33403A}
.box .legal{margin-top:12px;font-size:12.5px;color:var(--muted)}
.box .bot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.box > *:not(.bot){position:relative;z-index:2}

.steps{counter-reset:s}
.step{display:flex;gap:13px;padding:12px 0;border-top:1px dashed var(--line)}
.step:first-child{border-top:none;padding-top:0}
.step:last-child{padding-bottom:0}
.sn{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(169,201,78,.22);color:var(--green-d);font-size:11.5px;font-weight:800}
.step b{display:block;font-size:14.5px;color:var(--green-d);line-height:1.3}
.step span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}

.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.num b{display:block;font-weight:800;font-size:20px;color:var(--green-d);white-space:nowrap}
.num span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:#33403A}

details{margin:20px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
summary{padding:15px 18px;font-weight:700;font-size:14.5px;color:var(--green-d);cursor:pointer;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:19px;color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
.qr-body{padding:0 18px 18px}
.qr-hint{font-size:13px;color:var(--muted);margin:0 0 12px}
#qrBox{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:200px}
#qrBox svg{width:100%;max-width:220px;height:auto}
.qr-url{width:100%;margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#FAF9F5}
.qr-btns{display:flex;gap:8px;margin-top:10px}
.qr-btns button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#FAF9F5;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--green-d);cursor:pointer}
.qr-btns button.pri{background:var(--green);color:#fff;border-color:var(--green)}

/* ---------- подвал ---------- */
.foot{margin-top:22px;background:var(--navy);color:rgba(255,255,255,.62);padding:24px 20px 28px;text-align:center;font-size:12.5px}
.foot img{height:26px;width:auto;margin:0 auto 14px;opacity:.95}
.foot a.site{color:#fff;font-weight:700;font-size:14px}
.eco{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;line-height:1.8;color:rgba(255,255,255,.5)}
.eco a{color:rgba(255,255,255,.8);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--green-d);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

    {k:'tg',   href:'https://t.me/'+c.telegram,  label:'Telegram', sub:'@'+c.telegram, blank:1},
    {k:'mail', href:'mailto:'+c.email, label:t.aMail, sub:c.email},
    {k:'site', href:c.site, label:t.aSite, sub:c.site.replace(/^https?:\/\/(www\.)?/,''), blank:1}
  );
  if(c.catalog) a.push({k:'cat', href:c.catalog, label:t.aCat, sub:'', blank:1});
  return a;
}

function renderActions(){
  $('#acts').innerHTML = actions().map(a => `
    <a class="act" href="${a.href}" ${a.blank?'target="_blank" rel="noopener"':''} ${a.copy?`data-copy="${a.copy}"`:''}>
      <svg viewBox="0 0 24 24">${ICON[a.k]}</svg>
      <b>${a.label}</b>${a.sub?`<small>${a.sub}</small>`:''}
    </a>`).join('');
  document.querySelectorAll('[data-copy]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); navigator.clipboard?.writeText(el.dataset.copy); toast(el.dataset.copy); });
  });
}

function displayName(){
  const c = CONTACT;
  if(LANG === 'cn') return c.nameCn || c.nameEn;
  if(LANG === 'en') return c.nameEn;
  return (c.first + ' ' + c.last).trim();
}

function setLang(l){
  LANG = T[l] ? l : 'ru';
  const t = T[LANG], c = CONTACT;
  document.querySelectorAll('[data-i18n]').forEach(e=>{ const v = t[e.dataset.i18n]; if(v !== undefined) e.textContent = v; });
  document.documentElement.lang = {ru:'ru',en:'en',cn:'zh-CN'}[LANG];
  $('#nm').textContent = displayName();
  const alt = (c.alt[LANG] || '').trim();
  $('#alt').textContent = alt; $('#alt').hidden = !alt;
  $('#rl').textContent = c.role[LANG] || c.role.ru;
  $('#og').textContent = c.company + ' · ' + (c.address[LANG] || c.address.ru);
  $('#mono').textContent = ((c.first[0]||'A') + (c.last[0]||'')).toUpperCase();
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on', p.dataset.lang===LANG));
  renderActions();
  try{ localStorage.setItem('amma-card-lang', LANG); }catch(e){}
}

if(CONTACT.photo){ const p=$('#photo'); p.onload=()=>{ p.hidden=false; $('#mono').hidden=true; }; p.src=CONTACT.photo; }

/* ---- vCard ---- */
function vcard(){
  const c = CONTACT, t = T[LANG];
  return [
    'BEGIN:VCARD','VERSION:3.0',
    `N:${c.last};${c.first};;;`,
    `FN:${displayName()}`,
    `NICKNAME:${[c.nameEn, c.nameCn, c.alt.ru].filter(Boolean).join(', ')}`,
    `ORG:${c.company}`,
    `TITLE:${c.role[LANG] || c.role.ru}`,
    `TEL;TYPE=WORK,VOICE:${c.phoneCn}`,
    `TEL;TYPE=CELL,VOICE:${c.phoneRu}`,
    `EMAIL;TYPE=INTERNET,WORK:${c.email}`,
    `URL:${c.site}`,
    `ADR;TYPE=WORK:;;${(c.address[LANG]||c.address.ru)};;;;`,
    `NOTE:${t.aboutB.replace(/[\r\n]+/g,' ')}`,
    `X-SOCIALPROFILE;TYPE=telegram:https://t.me/${c.telegram}`,
    c.wechat ? `X-WECHAT:${c.wechat}` : null,
    'END:VCARD'
  ].filter(Boolean).join('\r\n');
}

$('#saveBtn').addEventListener('click', ()=>{
  const data = vcard();
  const name = ((CONTACT.nameEn||CONTACT.first).replace(/[^\w]+/g,'-') + '.vcf');
  try{
    const url = URL.createObjectURL(new Blob([data], {type:'text/vcard;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){ location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(data); }
  toast(T[LANG].okSave);
});

$('#shareBtn').addEventListener('click', async ()=>{
  const url = location.href, d = {title: displayName()+' — '+CONTACT.company, url};
  if(navigator.share){ try{ await navigator.share(d); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast(T[LANG].okCopy); }catch(e){}
});

/* ---- QR ---- */
function drawQR(){
  const box = $('#qrBox'), url = $('#qrUrl').value.trim() || location.href;
  try{
    const q = qrcode(0,'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), m = 2, size = n + m*2;
    let cells='';
    for(let r=0;r<n;r++) for(let c2=0;c2<n;c2++) if(q.isDark(r,c2)) cells += `<rect x="${c2+m}" y="${r+m}" width="1" height="1"/>`;
    box.innerHTML = `<svg id="qrSvgEl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
      <rect width="${size}" height="${size}" fill="#fff"/><g fill="#0E2A43">${cells}</g></svg>`;
  }catch(e){ box.textContent='—'; }
}
function dl(href,name){ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('#qrPng').addEventListener('click', ()=>{
  const svg=$('#qrSvgEl'); if(!svg) return;
  const s=new XMLSerializer().serializeToString(svg), img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=1200;
    const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,1200,1200); x.imageSmoothingEnabled=false;
    x.drawImage(img,0,0,1200,1200); dl(cv.toDataURL('image/png'),'amma-qr.png'); };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));
});
$('#qrSvg').addEventListener('click', ()=>{
  const svg=$('#qrSvgEl'); if(!svg) return;
  dl('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg)),'amma-qr.svg');
});
$('#qrUrl').addEventListener('input', drawQR);
$('#qrWrap').addEventListener('toggle', ()=>{ if($('#qrWrap').open) drawQR(); });

let tmr;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('on'),2200); }

document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>setLang(p.dataset.lang)));
let saved=null;
try{ saved=localStorage.getItem('amma-card-lang'); }catch(e){}
if(!saved){ const n=(navigator.language||'ru').toLowerCase(); saved = n.startsWith('zh')?'cn':n.startsWith('ru')?'ru':'en'; }
setLang(saved);
$('#qrUrl').value = location.protocol==='file:' ? 'https://www.ammaflowers.cn/anton' : location.href;
$('#siteLink').href = CONTACT.site;
$('#siteLink').textContent = CONTACT.site.replace(/^https?:\/\/(www\.)?/,'');
</script>
</body>
</html>
