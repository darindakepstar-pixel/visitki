<style>
:root{
  --deep:#0A1A4A;--navy:#14307A;--cyan:#00C6DE;--turq:#7FE6EC;--ink:#0C1630;--muted:#6B7790;
  --bg:#EDF1F8;--card:#fff;--line:rgba(10,26,74,.12);
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --dis:"Archivo","Manrope","PingFang SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding:0 0 max(28px,env(safe-area-inset-bottom))}
@media(min-width:560px){body{padding:28px 16px 48px}}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}   /* иначе пустой img перебивает атрибут hidden */
.who > div{min-width:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}
#card{max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:560px){#card{border-radius:26px;box-shadow:0 18px 50px rgba(10,26,74,.16)}}

/* ---------- шапка ---------- */
.top{position:relative;overflow:hidden;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 24px 26px;
  background:linear-gradient(158deg,#153A8A 0%,#0A1A4A 55%,#071232 100%)}
.top .net{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.top > *{position:relative;z-index:2}
.tbar{display:flex;align-items:center;gap:10px}
.tbar img.logo{height:28px;width:auto}
.pills{margin-left:auto;display:flex;gap:5px}
.pill{min-width:40px;min-height:32px;display:grid;place-items:center;font-size:11.5px;font-weight:700;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:rgba(255,255,255,.75);cursor:pointer;font-family:inherit;padding:0 8px}
.pill.on{background:#fff;color:var(--deep);border-color:#fff}

.who{display:flex;align-items:center;gap:16px;margin-top:26px}
.ava{width:84px;height:84px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#2C63C8,#0C2360);display:grid;place-items:center;
  box-shadow:0 0 0 2px rgba(127,230,236,.45), 0 8px 22px rgba(0,0,0,.3)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava span{font-family:var(--dis);font-weight:900;font-size:27px;color:rgba(255,255,255,.92);letter-spacing:.02em}
.who h1{font-family:var(--dis);font-weight:900;font-size:clamp(22px,6vw,27px);margin:0;line-height:1.15;letter-spacing:-.01em}
.who .alt{font-size:14px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:600}
.who .role{color:var(--turq);font-size:14px;font-weight:600;margin-top:5px}
.who .org{color:rgba(255,255,255,.6);font-size:13px;margin-top:2px}

.save{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;margin-top:22px;
  border:none;border-radius:14px;background:var(--cyan);color:#06183F;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.save:active{transform:scale(.99)}
.save svg{width:19px;height:19px;flex:none}
.share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:9px;
  border:1px solid rgba(255,255,255,.3);border-radius:14px;background:transparent;color:#fff;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer}

/* ---------- быстрые действия ---------- */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 16px 6px}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;min-height:84px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.act svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act b{font-size:12.5px;font-weight:600;color:var(--deep)}
.act small{font-size:10.5px;color:var(--muted);display:block;line-height:1.2;word-break:break-word}

/* ---------- секции ---------- */
.sec{padding:20px 16px 0}
.sec h2{font-family:var(--dis);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;padding-left:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.box p{margin:0;font-size:15px;color:#33405C}
.eco-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.eco-row:first-child{border-top:none;padding-top:0}
.eco-row:last-child{padding-bottom:0}
.gl{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:#EDF2FB;
  font-family:var(--dis);font-weight:900;font-size:12.5px;color:var(--navy)}
.gl.core{background:linear-gradient(150deg,#153A8A,#0A1A4A);padding:8px}
.eco-row .t{flex:1;min-width:0}
.eco-row b{display:block;font-size:15px;color:var(--deep)}
.eco-row span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.eco-row .go{font-size:12px;font-weight:700;color:var(--cyan);white-space:nowrap}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.num b{display:block;font-family:var(--dis);font-weight:900;font-size:20px;color:var(--deep);white-space:nowrap}
.num span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:#33405C}

/* ---------- QR ---------- */
details{margin:20px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
summary{padding:15px 18px;font-weight:700;font-size:14.5px;color:var(--deep);cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:19px;color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
.qr-body{padding:0 18px 18px}
.qr-hint{font-size:13px;color:var(--muted);margin:0 0 12px}
#qrBox{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:200px}
#qrBox svg{width:100%;max-width:220px;height:auto}
.qr-url{width:100%;margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#F7F9FD}
.qr-btns{display:flex;gap:8px;margin-top:10px}
.qr-btns button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#F7F9FD;
  font-family:inherit;font-weight:600;font-size:13.5px;color:var(--deep);cursor:pointer}
.qr-btns button.pri{background:var(--deep);color:#fff;border-color:var(--deep)}

.foot{text-align:center;padding:26px 16px 30px;color:var(--muted);font-size:12.5px}
.foot img{height:26px;width:auto;margin:0 auto 12px;opacity:.9}
.foot a{color:var(--navy);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="card">

  <div class="top">
    <svg class="net" viewBox="0 0 480 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#00C6DE" stop-opacity="0"/><stop offset=".5" stop-color="#00C6DE" stop-opacity=".55"/><stop offset="1" stop-color="#7FE6EC" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g stroke="rgba(255,255,255,.1)" stroke-width="1" fill="none">
        <path d="M-20 120 L90 70 L190 130 L300 60 L400 120 L500 70"/>
        <path d="M-20 300 L80 250 L200 310 L310 240 L420 300 L500 250"/>
        <path d="M90 70 L80 250 M190 130 L200 310 M300 60 L310 240 M400 120 L420 300"/>
      </g>
      <path d="M-30 210 C110 130 190 300 300 210 S440 120 520 190" fill="none" stroke="url(#fl)" stroke-width="2"/>
      <g fill="#7FE6EC" fill-opacity=".85">

      </g>

function actions(){
  const t = T[LANG], c = CONTACT;
  const a = [
    {k:'call', href:'tel:'+c.phone.replace(/[^\d+]/g,''), label:t.aCall, sub:c.phone}
  ];
  if(c.whatsapp) a.push({k:'wa', href:'https://wa.me/'+c.whatsapp, label:'WhatsApp', sub:''});
  if(c.telegram) a.push({k:'tg', href:'https://t.me/'+c.telegram, label:'Telegram', sub:'@'+c.telegram});
  if(c.wechat)   a.push({k:'wc', href:'#', label:'WeChat', sub:c.wechat, copy:c.wechat});
  a.push(
    {k:'mail', href:'mailto:'+c.email, label:t.aMail, sub:c.email},
    {k:'site', href:c.site,            label:t.aSite, sub:c.site.replace(/^https?:\/\//,'')}
  );
  return a;
}

function renderActions(){
  $('#acts').innerHTML = actions().map(a => `
    <a class="act" href="${a.href}" ${a.k==='site'||a.k==='wa'||a.k==='tg'?'target="_blank" rel="noopener"':''} ${a.copy?`data-copy="${a.copy}"`:''}>
      <svg viewBox="0 0 24 24">${ICON[a.k]}</svg>
      <b>${a.label}</b>${a.sub?`<small>${a.sub}</small>`:''}
    </a>`).join('');
  document.querySelectorAll('[data-copy]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      navigator.clipboard?.writeText(el.dataset.copy);
      toast(el.dataset.copy);
    });
  });
}

function setLang(l){
  LANG = T[l] ? l : 'ru';
  const t = T[LANG], c = CONTACT;
  document.querySelectorAll('[data-i18n]').forEach(e=>{
    const v = t[e.dataset.i18n]; if(v !== undefined) e.textContent = v;
  });
  document.documentElement.lang = {ru:'ru',en:'en',cn:'zh-CN'}[LANG];
  $('#nm').textContent = LANG === 'ru' ? c.last : c.nameEn;
  const alt = LANG === 'ru' ? (c.first + ' ' + c.patron) : '';
  let altEl = document.getElementById('alt');
  if(!altEl){ altEl = document.createElement('div'); altEl.id='alt'; altEl.className='alt';
    $('#nm').insertAdjacentElement('afterend', altEl); }
  altEl.textContent = alt; altEl.hidden = !alt;
  $('#rl').textContent = c.role[LANG] || c.role.ru;
  $('#og').textContent = c.company + ' · ' + (c.address[LANG] || c.address.ru);
  $('#mono').textContent = (c.last[0]||'') + (c.first[0]||'');
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on', p.dataset.lang===LANG));
  renderActions();
  try{ localStorage.setItem('srb-card-lang-nt', LANG); }catch(e){}
}

if(CONTACT.photo){ const p=$('#photo'); p.src=CONTACT.photo; p.hidden=false; $('#mono').style.display='none'; }

/* ---- vCard ---- */
function vcard(){
  const c = CONTACT, t = T[LANG];
  const L = [
    'BEGIN:VCARD','VERSION:3.0',
    `N:${c.last};${c.first};${c.patron||''};;`,
    `FN:${c.first} ${c.last}`,
    `ORG:${c.company}`,
    `TITLE:${c.role[LANG] || c.role.ru}`,
    `TEL;TYPE=CELL,VOICE:${c.phone}`,
    `EMAIL;TYPE=INTERNET,WORK:${c.email}`,
    `URL:${c.site}`,
    `ADR;TYPE=WORK:;;${(c.address[LANG]||c.address.ru)};;;;`,
    `NOTE:${t.aboutB.replace(/[\r\n]+/g,' ')}`,
    c.telegram ? `X-SOCIALPROFILE;TYPE=telegram:https://t.me/${c.telegram}` : null,
    c.wechat ? `X-WECHAT:${c.wechat}` : null,
    'END:VCARD'
  ];
  return L.filter(Boolean).join('\r\n');
}

$('#saveBtn').addEventListener('click', ()=>{
  const data = vcard();
  const name = (CONTACT.first + '-' + CONTACT.last + '.vcf').replace(/\s+/g,'');
  try{
    const blob = new Blob([data], {type:'text/vcard;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){
    location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(data);
  }
  toast(T[LANG].okSave);
});

$('#shareBtn').addEventListener('click', async ()=>{
  const url = location.href;
  const d = {title: CONTACT.first+' '+CONTACT.last+' — '+CONTACT.company, url};
  if(navigator.share){ try{ await navigator.share(d); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast(T[LANG].okCopy); }catch(e){}
});

/* ---- QR ---- */
function drawQR(){
  const box = $('#qrBox'); const url = $('#qrUrl').value.trim() || location.href;
  try{
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), m = 2, size = n + m*2;
    let cells = '';
    for(let r=0;r<n;r++) for(let col=0;col<n;col++)
      if(q.isDark(r,col)) cells += `<rect x="${col+m}" y="${r+m}" width="1" height="1"/>`;
    box.innerHTML = `<svg id="qrSvgEl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
      <rect width="${size}" height="${size}" fill="#fff"/><g fill="#0A1A4A">${cells}</g></svg>`;
  }catch(e){ box.textContent = '—'; }
}
function dl(href, name){ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

$('#qrPng').addEventListener('click', ()=>{
  const svg = $('#qrSvgEl'); if(!svg) return;
  const s = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement('canvas'); cv.width = cv.height = 1200;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,1200,1200);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img,0,0,1200,1200);
    dl(cv.toDataURL('image/png'), 'srb-qr.png');
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
});
$('#qrSvg').addEventListener('click', ()=>{
  const svg = $('#qrSvgEl'); if(!svg) return;
  const s = new XMLSerializer().serializeToString(svg);
  dl('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s), 'srb-qr.svg');
});
$('#qrUrl').addEventListener('input', drawQR);
$('#qrWrap').addEventListener('toggle', ()=>{ if($('#qrWrap').open) drawQR(); });

/* ---- всплывающее уведомление ---- */
let tmr;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(tmr); tmr = setTimeout(()=>el.classList.remove('on'), 2200);
}

document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>setLang(p.dataset.lang)));
let saved = null;
try{ saved = localStorage.getItem('srb-card-lang-nt'); }catch(e){}
if(!saved){ const n=(navigator.language||'ru').toLowerCase(); saved = n.startsWith('zh')?'cn':n.startsWith('ru')?'ru':'en'; }
setLang(saved);
$('#qrUrl').value = location.protocol === 'file:' ? CONTACT.site + '/tarasova' : location.href;
$('#siteLink').href = CONTACT.site;
$('#siteLink').textContent = CONTACT.site.replace(/^https?:\/\//,'');
