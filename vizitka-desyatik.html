<style>
:root{
  --deep:#0A1A4A;--navy:#14307A;--cyan:#00C6DE;--turq:#7FE6EC;
  --ink:#0C1630;--muted:#6B7790;--bg:#EEF1F7;--card:#fff;--line:rgba(10,26,74,.12);
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --dis:"Archivo","Manrope","PingFang SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding:0 0 max(28px,env(safe-area-inset-bottom))}
@media(min-width:560px){body{padding:28px 16px 48px}}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}
#card{max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:560px){#card{border-radius:26px;box-shadow:0 18px 50px rgba(10,26,74,.18)}}

/* шапка с фото терминала */
.top{position:relative;overflow:hidden;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 24px 28px}
.top .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,38,.62) 0%,rgba(7,19,45,.80) 45%,rgba(7,19,45,.95) 100%)}
.top > *:not(.ph):not(.veil){position:relative;z-index:2}
.tbar{display:flex;align-items:center;gap:12px;min-height:34px}
.wm{font-family:var(--dis);font-weight:900;font-size:19px;letter-spacing:.06em;line-height:1}
.wm span{display:block;font-size:8.5px;letter-spacing:.26em;color:var(--turq);font-weight:700;margin-top:5px}
.pills{margin-left:auto;display:flex;gap:5px}
.pill{min-width:40px;min-height:32px;display:grid;place-items:center;font-size:11.5px;font-weight:700;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.78);cursor:pointer;font-family:inherit;padding:0 8px}
.pill.on{background:#fff;color:var(--deep);border-color:#fff}

.who{display:flex;align-items:center;gap:16px;margin-top:26px}
.who > div{min-width:0}
.ava{width:86px;height:86px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(150deg,#22509E,#0C1E45);
  box-shadow:0 0 0 2px rgba(127,230,236,.4), 0 10px 26px rgba(0,0,0,.4)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava span{font-family:var(--dis);font-weight:900;font-size:26px;color:rgba(255,255,255,.92)}
.who h1{font-family:var(--dis);font-weight:900;font-size:clamp(21px,5.6vw,26px);margin:0;line-height:1.14;letter-spacing:-.01em}
.who .alt{font-size:14px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:600}
.who .role{color:var(--turq);font-size:13.5px;font-weight:700;margin-top:8px;line-height:1.35}

.save{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;margin-top:24px;
  border:none;border-radius:14px;background:var(--cyan);color:#06183F;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.save svg{width:19px;height:19px}
.share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:9px;
  border:1px solid rgba(255,255,255,.32);border-radius:14px;background:transparent;color:#fff;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 16px 4px}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;min-height:86px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.act svg{width:22px;height:22px;stroke:#16325F;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act b{font-size:12.5px;font-weight:700;color:var(--deep)}
.act small{font-size:10.5px;color:var(--muted);line-height:1.2;word-break:break-word}

.sec{padding:20px 16px 0}
.sec h2{font-family:var(--dis);font-size:12.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-left:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.box p{margin:0;font-size:15px;color:#33405C}
.addr{font-size:15px;line-height:1.55;color:#22314F;font-weight:600}
.addr small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:6px}
.route{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:46px;border-radius:13px;
  background:var(--deep);color:#fff;font-weight:700;font-size:14.5px}
.two{display:grid;gap:8px}
.tm{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tm .gl{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:#EDF2FB;
  font-family:var(--dis);font-weight:900;font-size:12.5px;color:var(--navy)}
.tm .t{flex:1;min-width:0}
.tm b{display:block;font-size:15px;color:var(--deep)}
.tm span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.tm .go{font-size:12px;font-weight:700;color:var(--cyan)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.num b{display:block;font-family:var(--dis);font-weight:900;font-size:20px;color:var(--deep);white-space:nowrap}
.num span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:#33405C}
.chip.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:7px;vertical-align:1px}

details{margin:20px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
summary{padding:15px 18px;font-weight:700;font-size:14.5px;color:var(--deep);cursor:pointer;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:19px;color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
.qr-body{padding:0 18px 18px}
.qr-hint{font-size:13px;color:var(--muted);margin:0 0 12px}
#qrBox{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:200px}
#qrBox svg{width:100%;max-width:220px;height:auto}
.qr-url{width:100%;margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#F7F9FD}
.qr-btns{display:flex;gap:8px;margin-top:10px}
.qr-btns button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#F7F9FD;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--deep);cursor:pointer}
.qr-btns button.pri{background:var(--deep);color:#fff;border-color:var(--deep)}

.foot{margin-top:22px;background:var(--deep);color:rgba(255,255,255,.62);padding:24px 20px 28px;text-align:center;font-size:12.5px}
.foot .wm{display:inline-block;color:#fff;margin-bottom:12px}
.foot a.site{color:#fff;font-weight:700;font-size:14px}
.eco{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;line-height:1.8;color:rgba(255,255,255,.5)}
.eco a{color:rgba(255,255,255,.8);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

/* ==========================================================
   3. ЛОГИКА
   ========================================================== */
const $ = s => document.querySelector(s);
let LANG = "ru";

const ICON = {
  call:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.8.8a2 2 0 0 1 1.7 2z"/>',
  mgr:'<path d="M17 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.5"/><path d="M19 8v6M22 11h-6"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2.5 6.5L12 13l9.5-6.5"/>',
  site:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a16 16 0 0 1 0 20 16 16 0 0 1 0-20"/>',
  pin:'<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>'
};

function mapUrl(){
  const q = encodeURIComponent(CONTACT.address.ru);
  return LANG === 'ru' ? 'https://yandex.ru/maps/?text=' + q
                       : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONTACT.address.en);
}

function actions(){
  const t = T[LANG], c = CONTACT, tel = s => 'tel:' + s.replace(/[^\d+]/g,'');
  return [
    {k:'call', href:tel(c.phone),   label:t.aCall, sub:c.phone},
    {k:'mgr',  href:tel(c.manager), label:t.aMgr,  sub:c.manager},
    {k:'mail', href:'mailto:'+c.email, label:t.aMail, sub:c.email},
    {k:'site', href:c.site,  label:t.aSite,  sub:'tltm9.ru', blank:1},
    {k:'site', href:c.site2, label:t.aSite2, sub:'tlt-scand.ru', blank:1},
    {k:'pin',  href:mapUrl(), label:t.route, sub:'', blank:1}
  ];
}

function renderActions(){
  $('#acts').innerHTML = actions().map(a => `
    <a class="act" href="${a.href}" ${a.blank?'target="_blank" rel="noopener"':''}>
      <svg viewBox="0 0 24 24">${ICON[a.k]}</svg>
      <b>${a.label}</b>${a.sub?`<small>${a.sub}</small>`:''}
    </a>`).join('');
}

function displayName(){
  const c = CONTACT;
  if(LANG === 'cn') return c.nameCn || c.nameEn;
  if(LANG === 'en') return c.nameEn;
  return c.last + ' ' + c.first + ' ' + c.patron;
}

function setLang(l){
  LANG = T[l] ? l : 'ru';
  const t = T[LANG], c = CONTACT;
  document.querySelectorAll('[data-i18n]').forEach(e=>{ const v = t[e.dataset.i18n]; if(v !== undefined) e.textContent = v; });
  document.documentElement.lang = {ru:'ru',en:'en',cn:'zh-CN'}[LANG];
  $('#nm').textContent = LANG === 'ru' ? c.last : displayName();
  const alt = LANG === 'ru' ? (c.first + ' ' + c.patron) : '';
  $('#alt').textContent = alt; $('#alt').hidden = !alt;
  $('#rl').textContent = c.role[LANG] || c.role.ru;
  $('#mono').textContent = (c.last[0] || '') + (c.first[0] || '');
  $('#addrText').innerHTML = (c.address[LANG] || c.address.ru) + (LANG !== 'ru' ? `<small>${c.address.ru}</small>` : '');
  $('#routeBtn').href = mapUrl();
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on', p.dataset.lang===LANG));
  renderActions();
  try{ localStorage.setItem('tlt-card-lang', LANG); }catch(e){}
}

if(CONTACT.photo){ const p=$('#photo'); p.onload=()=>{ p.hidden=false; $('#mono').hidden=true; }; p.src=CONTACT.photo; }

function vcard(){
  const c = CONTACT, t = T[LANG];
  return [
    'BEGIN:VCARD','VERSION:3.0',
    `N:${c.last};${c.first};${c.patron};;`,
    `FN:${displayName()}`,
    `NICKNAME:${c.nameEn}`,
    `ORG:${c.company}`,
    `TITLE:${c.role[LANG] || c.role.ru}`,
    `TEL;TYPE=CELL,VOICE:${c.phone}`,
    `TEL;TYPE=WORK,VOICE:${c.manager}`,
    `EMAIL;TYPE=INTERNET,WORK:${c.email}`,
    `URL:${c.site}`,
    `URL:${c.site2}`,
    `ADR;TYPE=WORK:;;${c.address.ru};;;;`,
    `NOTE:${t.termB.replace(/[\r\n]+/g,' ')}`,
    'END:VCARD'
  ].join('\r\n');
}

$('#saveBtn').addEventListener('click', ()=>{
  const data = vcard(), name = (CONTACT.nameEn.replace(/[^\w]+/g,'-') + '.vcf');
  try{
    const url = URL.createObjectURL(new Blob([data], {type:'text/vcard;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){ location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(data); }
  toast(T[LANG].okSave);
});

$('#shareBtn').addEventListener('click', async ()=>{
  const url = location.href, d = {title: displayName()+' — '+CONTACT.company, url};
  if(navigator.share){ try{ await navigator.share(d); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast(T[LANG].okCopy); }catch(e){}
});

function drawQR(){
  const box = $('#qrBox'), url = $('#qrUrl').value.trim() || location.href;
  try{
    const q = qrcode(0,'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), m = 2, size = n + m*2;
    let cells='';
    for(let r=0;r<n;r++) for(let c2=0;c2<n;c2++) if(q.isDark(r,c2)) cells += `<rect x="${c2+m}" y="${r+m}" width="1" height="1"/>`;
    box.innerHTML = `<svg id="qrSvgEl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
      <rect width="${size}" height="${size}" fill="#fff"/><g fill="#0A1A4A">${cells}</g></svg>`;
  }catch(e){ box.textContent='—'; }
}
function dl(href,name){ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('#qrPng').addEventListener('click', ()=>{
  const svg=$('#qrSvgEl'); if(!svg) return;
  const s=new XMLSerializer().serializeToString(svg), img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=1200;
    const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,1200,1200); x.imageSmoothingEnabled=false;
    x.drawImage(img,0,0,1200,1200); dl(cv.toDataURL('image/png'),'tltm9-qr.png'); };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));
});
$('#qrSvg').addEventListener('click', ()=>{
  const svg=$('#qrSvgEl'); if(!svg) return;
  dl('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg)),'tltm9-qr.svg');
});
$('#qrUrl').addEventListener('input', drawQR);
$('#qrWrap').addEventListener('toggle', ()=>{ if($('#qrWrap').open) drawQR(); });

let tmr;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('on'),2200); }

document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>setLang(p.dataset.lang)));
let saved=null;
try{ saved=localStorage.getItem('tlt-card-lang'); }catch(e){}
if(!saved){ const n=(navigator.language||'ru').toLowerCase(); saved = n.startsWith('zh')?'cn':n.startsWith('ru')?'ru':'en'; }
setLang(saved);
$('#qrUrl').value = location.protocol==='file:' ? 'https://www.tltm9.ru/desyatik' : location.href;
$('#siteLink').href = CONTACT.site;
</script>
